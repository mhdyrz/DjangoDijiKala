{% extends 'base.html' %}

{% block title %}Payment | DijiKala{% endblock %}

{% block content %}

<h2>Increase Balance</h2>

<div class="card">

    <p>
        Current Balance:
        <strong>${{ customer.balance }}</strong>
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post" class="payment-form">

        {% csrf_token %}

        <label for="amount">Amount</label>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="1"
            placeholder="Enter amount"
            required
        >

        <button type="submit" class="btn">
            Add Balance
        </button>

    </form>

</div>

<br>

<a href="{% url 'customer_panel' %}" class="btn">
    Back to Customer Panel
</a>

{% endblock %}
