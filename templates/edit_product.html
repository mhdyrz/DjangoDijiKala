{% extends 'base.html' %}

{% block title %}Edit Product | DijiKala{% endblock %}

{% block content %}

<h2>Edit Product</h2>

<div class="card">

    <p>
        Store:
        <strong>{{ product.store.name }}</strong>
    </p>

</div>

<br>

<form
    method="post"
    enctype="multipart/form-data"
    class="payment-form"
>

    {% csrf_token %}

    <label for="name">
        Product Name
    </label>

    <input
        type="text"
        id="name"
        name="name"
        value="{{ product.name }}"
        required
    >


    <label for="price">
        Price
    </label>

    <input
        type="number"
        id="price"
        name="price"
        value="{{ product.price }}"
        step="0.01"
        min="0"
        required
    >


    <label for="description">
        Description
    </label>

    <textarea
        id="description"
        name="description"
        rows="5"
        required
    >{{ product.description }}</textarea>


    <label for="image">
        Product Image
    </label>

    {% if product.image %}

        <p>
            Current image:
        </p>

        <img
            src="{{ product.image.url }}"
            alt="{{ product.name }}"
            style="width: 200px; height: 150px; object-fit: cover; border-radius: 8px;"
        >

        <br>
        <br>

    {% endif %}

    <input
        type="file"
        id="image"
        name="image"
        accept="image/*"
    >


    <br>
    <br>

    <button
        type="submit"
        class="btn"
    >
        Save Changes
    </button>

</form>

<br>

<a
    href="{% url 'manage_store' product.store.id %}"
    class="btn"
>
    Back to Manage Store
</a>

{% endblock %}
