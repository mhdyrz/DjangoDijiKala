{% extends 'base.html' %}

{% block title %}Login | DijiKala{% endblock %}

{% block content %}

<h2>Login</h2>

{% if error %}
    <div class="card">
        <p>{{ error }}</p>
    </div>
{% endif %}

<form method="post" class="auth-form">

    {% csrf_token %}

    <label for="username">Username</label>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter username"
        required
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
        required
    >

    <button type="submit" class="btn">
        Login
    </button>

</form>

<p>
    Don't have an account?
    <a href="{% url 'signup' %}">Sign Up</a>
</p>

{% endblock %}
