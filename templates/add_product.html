{% extends 'base.html' %}

{% block title %}Add Product | DijiKala{% endblock %}

{% block content %}

<h2>+ Add Product</h2>

<p>
    Add a new product to:
    <strong>{{ store.name }}</strong>
</p>

<form method="post" enctype="multipart/form-data" class="payment-form">

    {% csrf_token %}

    <label for="name">Product Name</label>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter product name"
        required
    >

    <label for="price">Price</label>
    <input
        type="number"
        id="price"
        name="price"
        step="0.01"
        min="0"
        placeholder="Enter product price"
        required
    >

    <label for="description">Description</label>
    <textarea
        id="description"
        name="description"
        placeholder="Enter product description"
        rows="5"
        required
    ></textarea>

    <label for="image">Product Image</label>
    <input
        type="file"
        id="image"
        name="image"
        accept="image/*"
    >

    <button type="submit" class="btn">
        Add Product
    </button>

</form>

<br>

<a href="{% url 'store_detail' store.id %}" class="btn">
    Back to Store
</a>

{% endblock %}
